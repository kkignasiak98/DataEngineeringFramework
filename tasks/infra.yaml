# https://taskfile.dev

version: '3'

tasks:

  lint_tf:
    desc: "Lint Terraform modules using tflint"
    dir: infrastructure/modules
    cmds:
      - tflint --recursive

  scan_tf:
    desc: "Scan Terraform modules for misconfigurations using Trivy"
    dir: infrastructure/modules
    cmds:
      - trivy config .

  tf_format:
    desc: "Format all Terragrunt HCL and OpenTofu Terraform files in the infrastructure directory"
    dir: infrastructure
    cmds:
      - terragrunt hcl fmt 
      - tofu fmt -recursive ./modules

  tf_format_check:
    desc: "Check formatting of all Terragrunt HCL and OpenTofu Terraform files without making changes"
    dir: infrastructure
    cmds:
      - terragrunt hcl fmt --check
      - tofu fmt -recursive --check ./modules

  plan:
    desc: "Run terragrunt plan for a specific environment (usage: task plan ENV=dev)"
    requires:
      vars: [ENV]
    vars:
      PLAN_DIR: '/tmp/terragrunt-plans'
    cmds:
      - cmd: mkdir -p {{.PLAN_DIR}}
      - cmd: |
          echo "Processing environment: {{.ENV}}"
          cd infrastructure/environments/{{.ENV}} && \
          terragrunt stack generate && \
          terragrunt stack run plan --out-dir={{.PLAN_DIR}}/{{.ENV}} --json-out-dir={{.PLAN_DIR}}/{{.ENV}}-json --non-interactive
      - cmd: trivy config {{.PLAN_DIR}}/{{.ENV}}

  plan_all:
    desc: Run terragrunt plan across all environments in infrastructure/environments/
    vars:
      ENVIRONMENTS:
        sh: ls infrastructure/environments/
    cmds:
      - for:
          var: ENVIRONMENTS
          split: "\n"
        task: plan
        vars:
          ENV: "{{.ITEM}}"
